unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

set -g window-size latest

# Without this, closing a Ghostty tab leaks a tmux session (+ a sysmon proc) forever.
set -g destroy-unattached on
set -g focus-events on
set -g escape-time 10
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

bind r source-file ~/.tmux.conf \; display "  tmux reloaded"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "phoenix-clip"

bind S run-shell "~/.local/bin/phoenix-sysmon-toggle"

set-hook -g session-created 'run-shell "~/.local/bin/phoenix-tmux-init"'
set-hook -g client-resized 'run-shell "~/.local/bin/phoenix-tmux-rebalance"'

gold="#c7910c"
bgold="#f1b115"
blue="#11B7D4"
green="#00a884"
red="#E35535"
pink="#d46ec0"
fg="#bec6d0"
bg="#0c0f11"
bg1="#1c2027"
muted="#475262"

# phoenix-sysmon already shows clock/date; tmux's own status bar is redundant.
set -g status off

set -g pane-border-style "fg=$bg1"
set -g pane-active-border-style "fg=$bg1"

# Bounce focus off banner/sysmon panes — combined with `select-pane -d` in
# their bin scripts, these panes are fully passive (no input, no cursor).
set-hook -g pane-focus-in 'if -F "#{||:#{==:#{pane_title},phoenix-banner},#{==:#{pane_title},phoenix-sysmon}}" "last-pane"'

set -g message-style "bg=$bg1,fg=$gold,bold"
set -g message-command-style "bg=$bg1,fg=$gold,bold"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
