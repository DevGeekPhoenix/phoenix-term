# ─────────────────────────────────────────────────────────────
#  Tmux · Phoenix Black & Gold
# ─────────────────────────────────────────────────────────────

# Prefix Ctrl-a is much faster than the default Ctrl-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Sane defaults
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Always size tmux windows to the latest attached client. Without this,
# resize-window commands or older default behavior can pin the window at
# a size larger than the visible viewport, clipping panes off the bottom.
set -g window-size latest

# Auto-destroy tmux sessions the moment their last client detaches.
# Closing a Ghostty tab/window detaches its tmux client; without this,
# the session keeps running (along with phoenix-sysmon in the sidebar) forever
# and they pile up into a load-average disaster.
set -g destroy-unattached on
set -g focus-events on
set -g escape-time 10
set -g history-limit 100000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
setw -g mode-keys vi

# ── Reload config quickly ───────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  tmux reloaded"

# ── Split panes in the cwd, intuitive keys ──────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-style pane navigation ───────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy-mode like vim ──────────────────────────────────────
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "phoenix-clip"

# ── System monitor sidebar (prefix + S to toggle) ───────────
# Opens a 34-col right pane running ~/.local/bin/phoenix-sysmon. Hit the
# binding again to close it. Logic lives in ~/.local/bin/phoenix-sysmon-toggle.
bind S run-shell "~/.local/bin/phoenix-sysmon-toggle"

# On every new session: optionally pin a banner pane at the top (when
# PHOENIX_BANNER_STICKY=sticky in ~/.config/phoenix-term/config.zsh), then
# spawn the phoenix-sysmon sidebar. Hook fires only on creation, not on
# attach from another client.
set-hook -g session-created 'run-shell "~/.local/bin/phoenix-tmux-init"'

# When the client resizes, re-pin the banner height and sysmon width so
# tmux doesn't redistribute space across them.
set-hook -g client-resized 'run-shell "~/.local/bin/phoenix-tmux-rebalance"'

# ─────────────────────────────────────────────────────────────
#  Theme · Phoenix Black & Gold (hand-styled, no plugin)
# ─────────────────────────────────────────────────────────────
gold="#c7910c"
bgold="#f1b115"
blue="#11B7D4"
green="#00a884"
red="#E35535"
pink="#d46ec0"
fg="#bec6d0"
bg="#0c0f11"
bg1="#1c2027"
muted="#475262"

# Hide the tmux status bar — phoenix-sysmon already shows the clock/date and
# the sidebar/section headers provide all the structure we need.
set -g status off

# Both inactive and active panes share the same dim border — no gold
# highlight on the focused pane. Disable by setting them to the same color.
set -g pane-border-style "fg=$bg1"
set -g pane-active-border-style "fg=$bg1"

# Never let focus rest on the banner or sysmon panes — if the user clicks
# on one (or navigation lands there), bounce immediately to last-pane.
# Combined with `select-pane -d` set by the bin scripts at startup, these
# panes are fully passive: no input, no focus, no cursor.
set-hook -g pane-focus-in 'if -F "#{||:#{==:#{pane_title},phoenix-banner},#{==:#{pane_title},phoenix-sysmon}}" "last-pane"'

set -g message-style "bg=$bg1,fg=$gold,bold"
set -g message-command-style "bg=$bg1,fg=$gold,bold"

# ─────────────────────────────────────────────────────────────
#  Plugins via TPM
# ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Continuum / Resurrect — survive reboots
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# Bootstrap TPM on first run, then load plugins
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
