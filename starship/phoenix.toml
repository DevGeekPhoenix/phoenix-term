add_newline = false
command_timeout = 1000
scan_timeout = 30

format = """
$nodejs\
$python\
$rust\
$golang\
$dotnet\
$directory\
$git_branch\
$custom

$character"""

[nodejs]
symbol = ""
detect_extensions = []
detect_files     = ["package.json", ".nvmrc", ".node-version"]
format = "[](fg:#1d2021)[ $symbol $version ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[python]
symbol = ""
format = "[](fg:#1d2021)[ $symbol $version ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[rust]
symbol = ""
format = "[](fg:#1d2021)[ $symbol $version ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[golang]
symbol = ""
format = "[](fg:#1d2021)[ $symbol $version ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[dotnet]
symbol = ""
heuristic = false
format = "[](fg:#1d2021)[ $symbol $version ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[directory]
truncation_length = 4
truncate_to_repo  = false
truncation_symbol = "…/"
read_only         = " "
home_symbol       = "~"
format = "[](fg:#1d2021)[  $path$read_only ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[git_branch]
symbol = ""
truncation_length = 40
truncation_symbol = "…"
format = "[](fg:#1d2021)[ $symbol $branch ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[custom.changes]
command = "git status --porcelain 2>/dev/null | wc -l | tr -d ' '"
when    = "git rev-parse --is-inside-work-tree >/dev/null 2>&1"
format  = "[](fg:#1d2021)[ ± $output ](fg:#20b2aa bg:#1d2021)[](fg:#1d2021) "

[character]
success_symbol = "[❯](bold fg:#20b2aa)"
error_symbol   = "[❯](bold fg:#fb4934)"
vimcmd_symbol  = "[❮](bold fg:#20b2aa)"